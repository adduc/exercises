<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Native Messaging PoC</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; padding: 8px; }
    textarea { width: 100%; height: 140px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
    button { margin-bottom: 6px; }
  </style>
</head>
<body>
  <input id="text" type="text" placeholder="Message to send" value="hello from the extension">
  <button id="send">Send to native host</button>
  <textarea id="output" readonly placeholder="Response will appear here"></textarea>
  <script src="popup.js"></script>
</body>
</html>
