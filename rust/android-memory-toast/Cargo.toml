[package]
name = "memory_toast"
version = "0.1.0"
edition = "2024"

[dependencies]
android_logger = "0.15.1"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
jni = "0.22.4"
log = "0.4.33"
ndk-context = "0.1.1"
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.android]
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

# Self-signed, personal-use-only key for side-loading release builds onto
# this device — not suitable for Play Store distribution.
[package.metadata.android.signing.release]
path = "/home/jlong/.android/memory_toast_release.keystore"
keystore_password = "memorytoast"
